<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Courier New', monospace" role="img" aria-label="X-COM: A Tribute">
  <defs>
    <!-- CRT phosphor glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Tactical grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#008855" stroke-width="1" opacity="0.35"/>
    </pattern>
    <!-- Scanlines -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="#000000"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <g stroke="#00ff00" stroke-width="2" fill="none" opacity="0.8">
    <path d="M24 24 H84 M24 24 V84"/>
    <path d="M1256 24 H1196 M1256 24 V84"/>
    <path d="M24 336 H84 M24 336 V276"/>
    <path d="M1256 336 H1196 M1256 336 V276"/>
  </g>

  <!-- Tactical readouts -->
  <g fill="#ffff00" font-size="15" opacity="0.85" filter="url(#glow)">
    <text x="44" y="60">LAT: 52.5200</text>
    <text x="44" y="80">LONG: 13.4050</text>
    <text x="44" y="100">ALT: 4500m</text>
    <text x="1236" y="60" text-anchor="end">STATUS: DEFCON 3</text>
    <text x="1236" y="80" text-anchor="end">SATELLITE: ACTIVE</text>
    <text x="1236" y="100" text-anchor="end">SCANNING...</text>
  </g>

  <!-- Title -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="640" y="180" fill="#ffff00" font-size="120" font-weight="bold" letter-spacing="14">X-COM</text>
    <text x="640" y="230" fill="#00ff00" font-size="30" letter-spacing="8">A TRIBUTE</text>
  </g>

  <!-- Tagline -->
  <text x="640" y="285" text-anchor="middle" fill="#00f0aa" font-size="20" letter-spacing="3" filter="url(#glow)">
    HUMANITY'S LAST LINE OF DEFENSE<tspan fill="#00ff00">_</tspan>
  </text>

  <!-- Era stamp -->
  <text x="640" y="320" text-anchor="middle" fill="#008855" font-size="14" letter-spacing="4">
    EXTRATERRESTRIAL COMBAT UNIT &#8212; EST. 1994
  </text>

  <!-- Overlays -->
  <rect width="1280" height="360" fill="url(#scan)"/>
  <rect width="1280" height="360" fill="url(#vignette)"/>
</svg>
